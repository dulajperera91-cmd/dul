<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dul-KPI Dashboard">
<script src="config.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dul-KPI Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: black brand bar with logo + month switcher; dashboard of hero progress, KPI tiles, daily chart and 10-day blocks; separate PIN-locked data entry area. */
:root{
  --bg:#f1f2f4; --surface:#ffffff; --surface-2:#e9ebee; --line:#dadde2; --ink:#111214; --muted:#5d636c; --brand:#111214; --brand-ink:#ffffff;
  --good:#12784f; --good-bg:#e1f3ea; --bad:#be3a2e; --bad-bg:#fbe7e4; --warn:#a96a0a; --warn-bg:#fbf0dc; --ly:#9aa1aa; --track:#e3e6ea; --markf:none;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0d0e10; --surface:#16181b; --surface-2:#1e2125; --line:#2b2f35; --ink:#eef0f2; --muted:#9aa2ab; --brand:#000000; --brand-ink:#ffffff;
  --good:#4cc38a; --good-bg:#12301f; --bad:#f07a6e; --bad-bg:#3a1714; --warn:#e5a64b; --warn-bg:#36260c; --ly:#6c747e; --track:#262a30; --markf:invert(1); color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* header */
header.top{background:var(--brand);color:var(--brand-ink);position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top,0px)}
header.top .wrap{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;padding-block:10px}
.logo{height:34px;width:auto;filter:invert(1);display:block}
.ttl{display:flex;flex-direction:column;line-height:1.1;margin-right:auto;min-width:0}
.ttl small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.ttl b{font-family:var(--f-display);font-size:22px;font-weight:600;letter-spacing:.02em}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav button,.monthnav select{background:#222428;border:1px solid #33363b;color:#fff;border-radius:8px;padding:7px 10px}
.monthnav select{min-width:150px}
.tabs{display:flex;gap:4px;background:#1e2024;border-radius:10px;padding:3px}
.tabs button{border:0;background:none;color:#c9cdd2;border-radius:8px;padding:7px 12px;font-weight:500}
.tabs button[aria-selected="true"]{background:#fff;color:#111}
.status{font-size:12px;color:var(--muted);padding-block:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.status.err .dot{background:var(--bad)}

/* cards */
section.block{margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.h h2{margin:0;font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.h span{color:var(--muted);font-size:12px}
.h .right{margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.big{font-size:56px;font-weight:700;line-height:.95}
.big small{font-family:var(--f-body);font-size:14px;font-weight:500;color:var(--muted);margin-left:6px;letter-spacing:0}
.sub{color:var(--muted);font-size:13px}
.bar{position:relative;height:16px;background:var(--track);border-radius:999px;margin:16px 0 8px;overflow:visible}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:999px}
.bar .pace{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--warn)}
.bar .pace::after{content:attr(data-l);position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--warn);white-space:nowrap;font-weight:600}
.barlbl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px}
.barlbl b{font-family:var(--f-display);font-size:18px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0}
.stat label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .v{font-size:26px;font-weight:600;line-height:1.1}
.stat .n{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}

/* KPI tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.tile.good::before{background:var(--good)}.tile.bad::before{background:var(--bad)}.tile.warn::before{background:var(--warn)}
.tile label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:6px}
.tile .v{font-size:36px;font-weight:700;line-height:1}
.tile .row{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.tile .row b{color:var(--ink);font-weight:600}

/* latest day + blocks */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.daygrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.blocks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.blk{background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0}
.blk .t{font-weight:600;font-size:13px}
.blk .mini{height:8px;background:var(--track);border-radius:99px;margin:8px 0 6px;overflow:hidden}
.blk .mini i{display:block;height:100%;background:var(--ink)}

/* chart */
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}

/* tables */
.tbox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table.t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
.t th,.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.t th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface);position:sticky;top:0}
.t td:first-child,.t th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.t tr.tot td{font-weight:700;background:var(--surface-2)}
.t tr.tot td:first-child{background:var(--surface-2)}
.t tr.future td{color:var(--muted)}
.t tr.today td{background:var(--warn-bg)}
.t tr.today td:first-child{background:var(--warn-bg)}
.t .g{color:var(--good);font-weight:600}.t .r{color:var(--bad);font-weight:600}
.t td.rm{text-align:left;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis}
.ib{display:inline-block;height:6px;background:var(--ink);border-radius:9px;vertical-align:middle;margin-left:6px}
.ib.ly{background:var(--ly)}

/* entry */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:500}
.subtabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12px;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%;font-size:16px}
.f input.big{font-family:var(--f-display);font-size:26px;font-weight:600;padding:8px 12px}
.f.wide{grid-column:span 2}
.f.full{grid-column:1/-1}
.preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.preview .stat{flex:1 1 120px}
details.ly{margin-top:14px;border:1px dashed var(--line);border-radius:12px;padding:10px 14px}
details.ly summary{cursor:pointer;font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.msg{font-size:13px;font-weight:500}
.msg.ok{color:var(--good)}.msg.err{color:var(--bad)}
.grid input{width:92px;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 6px;text-align:right;font-size:13px}
.grid input.rmk{width:150px;text-align:left}
.grid input:focus{border-color:var(--ink);background:var(--surface)}
.grid input.dirty{background:var(--warn-bg)}
.grid th.lyh{color:var(--ly)}
.note{font-size:12px;color:var(--muted)}
.lock{max-width:420px;margin:30px auto;text-align:center}
.lock .f{text-align:left;margin-top:14px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* vs last year */
.vsly{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr);gap:12px;align-items:stretch}
.vsly .stat .v{font-size:30px}
.vsly .res{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.vsly .res.good{background:var(--good-bg);color:var(--good)}.vsly .res.bad{background:var(--bad-bg);color:var(--bad)}
.vsly .res label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.vsly .res .v{font-size:34px;font-weight:700;line-height:1.05}
.vsly .res .p{font-size:15px;font-weight:600}
.cmp{margin-top:12px;display:grid;gap:6px}
.cmp .r{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.cmp .track{height:12px;background:var(--track);border-radius:99px;overflow:hidden}
.cmp .track i{display:block;height:100%;border-radius:99px}
@media (max-width:640px){.vsly{grid-template-columns:1fr 1fr}.vsly .res{grid-column:1/-1}.cmp .r{grid-template-columns:80px 1fr}}

/* toast + paste box */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
#toast .btn{background:var(--bg);color:var(--ink);border-color:var(--bg);padding:6px 12px}
@media (max-width:640px){#toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.pastebox textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.grid input::placeholder{color:var(--ly)}

/* staff */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;font-weight:500}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.rank{display:grid;gap:6px}
.rank .r{display:grid;grid-template-columns:minmax(90px,170px) 1fr 64px;gap:10px;align-items:center;font-size:13px}
.rank .r span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .track{height:12px;background:var(--track);border-radius:99px;position:relative;overflow:hidden}
.rank .track i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--ink)}
.rank .track i.good{background:var(--good)}.rank .track i.bad{background:var(--bad)}.rank .track i.warn{background:var(--warn)}
.rank .track b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--warn)}
.rank .p{text-align:right;font-family:var(--f-display);font-size:16px;font-weight:600}
.t td.l{text-align:left}
.t input.cb{width:18px;height:18px}
.recon{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-top:10px}
.grid input.w{width:150px;text-align:left}
.grid input.s{width:60px}
.t td .x{border:0;background:none;color:var(--bad);font-size:16px;padding:2px 6px}
.ytdchart .m{font-size:10px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0 0 6px;font-family:var(--f-display);font-size:24px}
.sheet textarea{width:100%;min-height:330px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace}

.bottombar{display:none}
@media (max-width:980px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.hero,.two{grid-template-columns:1fr}.form{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){
  .tabs{display:none}
  .logo{height:26px}
  .ttl b{font-size:18px}
  .monthnav{width:100%}.monthnav select{flex:1}
  .big{font-size:44px}
  .tile .v{font-size:30px}
  .tile label span{display:none}
  .tile{padding:12px}
  .seg button{padding:7px 10px}
  .rank .r{grid-template-columns:minmax(80px,120px) 1fr 52px}
  .daygrid,.blocks{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  body{padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
  .bottombar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:4px}
  .bottombar button{border:0;background:none;border-radius:10px;min-height:54px;font-weight:600;font-size:11px;padding:0 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted)}
  .bottombar svg{width:22px;height:22px}
  .bottombar button[aria-selected="true"]{background:var(--surface-2);color:var(--ink)}
}
@media (prefers-reduced-motion:no-preference){.bar i,.blk .mini i{transition:width .5s ease}}
</style>
</head>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
/* ================= data access (Google Apps Script) ================= */
const API=window.KPI_API||'';
async function gas(fn,...args){
  if(!API)throw {code:'offline',message:'not connected'};
  let r;try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args}),redirect:'follow'});}
  catch(e){throw {code:'offline',message:'No internet connection'};}
  let j;try{j=await r.json();}catch(e){throw {code:'error',message:'The server did not answer correctly'};}
  if(j.err)throw {code:/PIN/i.test(j.err)?'pin':'error',message:j.err};
  return j.ok;}

const S={smDirty:new Map(),docs:{},rev:-1,pin:'',canWrite:false,tab:'dash',sub:'day',ym:null,year:null,dirty:new Map(),busy:false};
const $=id=>document.getElementById(id);
function store(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function recall(k){try{return localStorage.getItem(k)}catch(e){return null}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setStatus(t,err){$('statusText').textContent=t;$('status').classList.toggle('err',!!err);}

/* ================= formatting ================= */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const n0=v=>v==null||!isFinite(v)?'–':Math.round(v).toLocaleString('en-US');
const n2=v=>v==null||!isFinite(v)?'–':(+v).toFixed(2);
const pct=(v,d=1)=>v==null||!isFinite(v)?'–':(v*100).toFixed(d)+'%';
const sgn=(v,d=1)=>v==null||!isFinite(v)?'–':(v>=0?'+':'')+(v*100).toFixed(d)+'%';
const fmtK={sales:n0,atv:n0,upt:n2,asp:n0,cr:v=>pct(v,1),traffic:n0,inv:n0,qty:n0};
function pill(v,{good=0,label}={}){if(v==null||!isFinite(v))return '<span class="pill neutral">–</span>';const c=v>=good?'good':'bad';return `<span class="pill ${c}">${label??sgn(v)}</span>`;}
function todayIso(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function dObj(iso){return new Date(iso+'T12:00:00');}
function niceDate(iso){const d=dObj(iso);return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;}
function ymLabel(ym){const [y,m]=ym.split('-');return MONF[+m-1]+' '+y;}
function daysIn(ym){const [y,m]=ym.split('-').map(Number);const n=new Date(y,m,0).getDate();return Array.from({length:n},(_,i)=>`${ym}-${String(i+1).padStart(2,'0')}`);}
function shiftYm(ym,k){let [y,m]=ym.split('-').map(Number);m+=k;while(m<1){m+=12;y--;}while(m>12){m-=12;y++;}return `${y}-${String(m).padStart(2,'0')}`;}

/* ================= calculations ================= */
const isNum=v=>typeof v==='number'&&isFinite(v);
const entered=d=>d&&isNum(d.sales);
function tot(list,pick=d=>d){const t={sales:0,qty:0,inv:0,traffic:0,target:0};list.forEach(x=>{const d=pick(x)||{};for(const k in t)if(isNum(d[k]))t[k]+=d[k];});return t;}
function ratios(t){return{atv:t.inv?t.sales/t.inv:null,upt:t.inv?t.qty/t.inv:null,asp:t.qty?t.sales/t.qty:null,cr:t.traffic?t.inv/t.traffic:null};}
const lfl=(a,b)=>isNum(a)&&isNum(b)&&b?(a-b)/b:null;
function settings(ym){
  if(S.docs['m:'+ym]) return {...DEFAULTS,...S.docs['m:'+ym]};
  const prev=Object.keys(S.docs).filter(k=>k.startsWith('m:')&&k.slice(2)<ym).sort().pop();
  return {...DEFAULTS,...(prev?S.docs[prev]:{}),target:undefined};
}
const DEFAULTS={atv:300,upt:3,asp:155,cr:0.25,store:'FO Ramada'};
function month(ym){
  const days=daysIn(ym).map(date=>({date,...(S.docs['d:'+date]||{})}));
  const done=days.filter(entered);
  const set=settings(ym);
  let monthTarget=tot(days).target; if(!monthTarget&&isNum(set.target)) monthTarget=set.target;
  const tdTarget=tot(done).target;
  const ty=tot(done), lyM=tot(done,lyOf), lyAll=tot(days,lyOf);
  const r=ratios(ty), rl=ratios(lyM);
  const nod=days.length, left=nod-done.length;
  const remaining=Math.max(monthTarget-ty.sales,0);
  const blocks=[[0,10],[10,20],[20,nod]].map(([a,b],i)=>{const sl=days.slice(a,b),dn=sl.filter(entered);const tg=tot(sl).target,sa=tot(dn).sales;return{name:['1st','2nd','3rd'][i]+' 10 days',from:sl[0].date,to:sl[sl.length-1].date,target:tg,sales:sa,tdTarget:tot(dn).target,done:dn.length,count:sl.length};});
  return{ym,days,done,set,monthTarget,tdTarget,ty,lyM,lyAll,r,rl,nod,left,remaining,
    ach:monthTarget?ty.sales/monthTarget:null, achTD:tdTarget?ty.sales/tdTarget:null,
    avgDay:done.length?ty.sales/done.length:null, reqDay:left?remaining/left:null,
    forecast:tdTarget?ty.sales/tdTarget*monthTarget:null, last:done[done.length-1]||null, blocks};
}
function monthTotalsFor(ym){ // for year view: daily data if any, else saved monthly totals
  const days=daysIn(ym).map(date=>S.docs['d:'+date]?{date,...S.docs['d:'+date]}:null).filter(Boolean);
  const done=days.filter(entered);
  if(done.length){const ly=tot(done,lyOf);return {ty:tot(done),ly:ly.sales?ly:null,src:'daily',days:done.length,of:daysIn(ym).length};}
  const [y,m]=ym.split('-');const h=S.docs['h:'+ym], lyYm=(y-1)+'-'+m, hl=S.docs['h:'+lyYm];
  let ly=hl?tot([hl]):null;
  if(!ly){const ld=daysIn(lyYm).map(x=>S.docs['d:'+x]).filter(entered);if(ld.length)ly=tot(ld);}
  return {ty:h?tot([h]):null,ly,src:'totals'};
}

/* ================= rendering ================= */
function allMonths(){
  const set=new Set();Object.keys(S.docs).forEach(k=>{if(k.startsWith('d:'))set.add(k.slice(2,9));if(k.startsWith('m:'))set.add(k.slice(2));});
  const cur=todayIso().slice(0,7);set.add(cur);set.add(shiftYm(cur,1));set.add(shiftYm(cur,2));return [...set].sort();
}
function chrome(){
  const ms=allMonths(); if(!S.ym||!ms.includes(S.ym)) S.ym=ms.includes(todayIso().slice(0,7))?todayIso().slice(0,7):ms[ms.length-1];
  $('monthSel').innerHTML=ms.slice().reverse().map(m=>`<option value="${m}">${ymLabel(m)}</option>`).join('');
  $('monthSel').value=S.ym;
  document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
  $('storeName').textContent=settings(S.ym).store||'Store';
  const showM=S.tab!=='year'; document.querySelector('.monthnav').style.visibility=showM?'visible':'hidden';
}
function render(){chrome();const a=$('app');
  if(S.tab==='dash') a.innerHTML=dashView(); else if(S.tab==='daily') a.innerHTML=dailyView(); else if(S.tab==='staff') a.innerHTML=staffView(); else if(S.tab==='year') a.innerHTML=yearView(); else a.innerHTML=entryView();
  if(S.tab==='entry'){bindEntry();bindEntry2();}
}

function vsLyCard(ty,ly,title,sub,tyLbl,lyLbl){
  if(!isNum(ly)||!ly) return '';
  const diff=ty-ly, p=diff/ly, good=diff>=0, mx=Math.max(ty,ly)||1;
  return `<section class="block card"><div class="h"><h2>${title}</h2><span>${sub}</span></div><div class="vsly">
    <div class="stat"><label>${tyLbl}</label><div class="v num">${n0(ty)}</div><div class="n">SAR</div></div>
    <div class="stat"><label>${lyLbl}</label><div class="v num">${n0(ly)}</div><div class="n">SAR</div></div>
    <div class="res ${good?'good':'bad'}"><label>${good?'Growth vs last year':'Short vs last year'}</label><div class="v num">${good?'+':'−'}${n0(Math.abs(diff))}</div><div class="p">${good?'+':'−'}${(Math.abs(p)*100).toFixed(1)}% ${good?'ahead of':'behind'} last year</div></div></div>
    <div class="cmp"><div class="r"><span>${tyLbl}</span><div class="track"><i style="width:${ty/mx*100}%;background:var(--ink)"></i></div></div><div class="r"><span>${lyLbl}</span><div class="track"><i style="width:${ly/mx*100}%;background:var(--ly)"></i></div></div></div></section>`;
}
function kpiTile(key,label,val,target,lyVal,opt={}){
  const f=fmtK[key]; const vsT=isNum(target)&&isNum(val)&&target?val/target:null; const lf=lfl(val,lyVal);
  const cls=vsT!=null?(vsT>=1?'good':vsT>=0.9?'warn':'bad'):(lf!=null?(lf>=0?'good':'bad'):'');
  return `<div class="tile ${cls}"><label>${label}${opt.hint?`<span>${opt.hint}</span>`:''}</label><div class="v num">${f(val)}</div>
    ${isNum(target)?`<div class="row"><span>Target <b>${f(target)}</b></span><span class="pill ${vsT>=1?'good':vsT>=0.9?'warn':'bad'}">${pct(vsT,0)}</span></div>`:''}
    <div class="row"><span>LY <b>${f(lyVal)}</b></span>${pill(lf,{label:'LFL '+sgn(lf)})}</div></div>`;
}
function dashView(){
  const M=month(S.ym); const t=todayIso();
  if(!M.days.some(d=>isNum(d.target)||entered(d))) return `<div class="card empty"><b>No data for ${ymLabel(S.ym)} yet.</b><br>Add targets and sales in <b>Data entry</b>.</div>`;
  const paceShare=M.monthTarget?M.tdTarget/M.monthTarget:0, achW=Math.min((M.ach||0)*100,100);
  const reqBad=M.reqDay!=null&&M.avgDay!=null&&M.reqDay>M.avgDay;
  const salesLfl=lfl(M.ty.sales,M.lyM.sales);
  let h=`<section class="block hero">
   <div class="card"><div class="h"><h2>${ymLabel(S.ym)}</h2><span>${M.done.length} of ${M.nod} days entered${M.last?' · up to '+niceDate(M.last.date):''}</span><button class="btn right" data-act="wa">Copy WhatsApp report</button><button class="btn" data-act="xl">⬇ Excel</button></div>
    <div class="big num">${n0(M.ty.sales)}<small>SAR month to date</small></div>
    <div class="sub">vs target to date <b>${n0(M.tdTarget)}</b> → ${pill(M.achTD!=null?M.achTD-1:null,{label:pct(M.achTD,1)})} &nbsp; LFL ${pill(salesLfl)}</div>
    <div class="bar" title="Achieved ${pct(M.ach)} of month target"><i style="width:${achW}%"></i>${paceShare?`<span class="pace" style="left:${Math.min(paceShare*100,100)}%" data-l="where we should be"></span>`:''}</div>
    <div class="barlbl"><span>Achieved <b class="num">${pct(M.ach)}</b></span><span>To go <b class="num">${n0(M.remaining)}</b></span><span>Month target <b class="num">${n0(M.monthTarget)}</b></span></div>
   </div>
   <div class="card stats">
    <div class="stat"><label>Average per day</label><div class="v num">${n0(M.avgDay)}</div><div class="n">so far this month</div></div>
    <div class="stat"><label>Needed per day</label><div class="v num" style="color:${reqBad?'var(--bad)':'var(--good)'}">${n0(M.reqDay)}</div><div class="n">${M.left} days left</div></div>
    <div class="stat"><label>Forecast</label><div class="v num">${n0(M.forecast)}</div><div class="n">at current pace · ${pct(M.forecast/M.monthTarget,0)} of target</div></div>
    <div class="stat"><label>LY same days</label><div class="v num">${n0(M.lyM.sales)}</div><div class="n">LY full month ${n0(M.lyAll.sales)}</div></div>
   </div></section>`;
  if(M.last) h+=vsLyCard(M.ty.sales,M.lyM.sales,'This year vs last year · to date',`1–${dObj(M.last.date).getDate()} ${MON[dObj(M.last.date).getMonth()]} ${S.ym.slice(0,4)} vs the same dates ${+S.ym.slice(0,4)-1}`,'This year to date','Last year to date');
  h+=`<section class="block"><div class="h"><h2>Month to date KPIs</h2><span>Coloured edge: green on target, amber within 10%, red below</span></div><div class="tiles">
    ${kpiTile('sales','Sales',M.ty.sales,M.tdTarget,M.lyM.sales,{hint:'SAR'})}
    ${kpiTile('cr','Conversion (CR)',M.r.cr,M.set.cr,M.rl.cr,{hint:'inv ÷ footfall'})}
    ${kpiTile('atv','ATV',M.r.atv,M.set.atv,M.rl.atv,{hint:'sales ÷ inv'})}
    ${kpiTile('asp','ASP',M.r.asp,M.set.asp,M.rl.asp,{hint:'sales ÷ qty'})}
    ${kpiTile('upt','UPT',M.r.upt,M.set.upt,M.rl.upt,{hint:'qty ÷ inv'})}
    ${kpiTile('traffic','Footfall',M.ty.traffic,null,M.lyM.traffic)}
    ${kpiTile('inv','Invoices',M.ty.inv,null,M.lyM.inv)}
    ${kpiTile('qty','Units sold',M.ty.qty,null,M.lyM.qty)}
  </div></section>`;
  const L=M.last;
  h+=`<section class="block two"><div class="card"><div class="h"><h2>Latest day</h2><span>${L?niceDate(L.date):'No sales entered yet'}</span></div>`;
  if(L){const Lly=lyOf(L);const r=ratios(tot([L])),rl=Lly?ratios(tot([Lly])):{};const lyS=Lly&&Lly.sales;
    h+=`<div class="daygrid">
      <div class="stat"><label>Sales</label><div class="v num">${n0(L.sales)}</div><div class="n">target ${n0(L.target)} · ${pct(L.target?L.sales/L.target:null,0)}</div></div>
      <div class="stat"><label>LY same day</label><div class="v num">${n0(lyS)}</div><div class="n">Day LFL ${pill(lfl(L.sales,lyS))}</div></div>
      <div class="stat"><label>CR</label><div class="v num">${pct(r.cr)}</div><div class="n">LY ${pct(rl.cr)}</div></div>
      <div class="stat"><label>ATV</label><div class="v num">${n0(r.atv)}</div><div class="n">LY ${n0(rl.atv)}</div></div>
      <div class="stat"><label>ASP</label><div class="v num">${n0(r.asp)}</div><div class="n">LY ${n0(rl.asp)}</div></div>
      <div class="stat"><label>UPT</label><div class="v num">${n2(r.upt)}</div><div class="n">LY ${n2(rl.upt)}</div></div></div>
      ${L.remark?`<p class="note">Note: ${esc(L.remark)}</p>`:''}`;}
  h+=`</div><div class="card"><div class="h"><h2>10-day targets</h2></div><div class="blocks">`+M.blocks.map(b=>{const a=b.target?b.sales/b.target:0;
      return `<div class="blk"><div class="t">${b.name}</div><div class="n note">${dObj(b.from).getDate()}–${dObj(b.to).getDate()} ${MON[dObj(b.from).getMonth()]}</div><div class="mini"><i style="width:${Math.min(a*100,100)}%"></i></div>
       <div class="num" style="font-size:22px;font-weight:600">${pct(a,0)}</div><div class="note">${n0(b.sales)} / ${n0(b.target)}</div></div>`;}).join('')+`</div></div></section>`;
  h+=`<section class="block card"><div class="h"><h2>Daily sales</h2><span>This year vs last year and target</span></div>${chart(M)}
    <div class="legend"><span><i style="background:var(--ink)"></i>Sales this year</span><span><i style="background:var(--ly)"></i>Last year same day</span><span><i style="background:transparent;border:2px dashed var(--warn)"></i>Daily target</span></div></section>`;
  return h;
}
function chart(M){
  const W=760,H=250,pl=46,pr=8,pt=10,pb=26; const n=M.days.length, bw=(W-pl-pr)/n;
  const mx=Math.max(1,...M.days.map(d=>Math.max(d.sales||0,d.target||0,(lyOf(d)&&lyOf(d).sales)||0)));
  const step=Math.pow(10,Math.floor(Math.log10(mx)));let tick=step;while(mx/tick>5)tick*=2;const top=Math.ceil(mx/tick)*tick;
  const y=v=>pt+(H-pt-pb)*(1-v/top); let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily sales chart">`;
  for(let v=0;v<=top;v+=tick){s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v>=1000?(v/1000)+'k':v}</text>`;}
  const today=todayIso();
  M.days.forEach((d,i)=>{const x=pl+i*bw;
    if(entered(d))s+=`<rect x="${x+bw*0.18}" y="${y(d.sales)}" width="${bw*0.64}" height="${H-pb-y(d.sales)}" rx="2" fill="var(--ink)"><title>${niceDate(d.date)}: ${n0(d.sales)} SAR</title></rect>`;
    if(isNum(d.target))s+=`<line x1="${x+bw*0.08}" x2="${x+bw*0.92}" y1="${y(d.target)}" y2="${y(d.target)}" stroke="var(--warn)" stroke-width="2" stroke-dasharray="3 2"/>`;
    const dd=dObj(d.date).getDate(); if(dd===1||dd%5===0||d.date===today) s+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="${d.date===today?'var(--ink)':'var(--muted)'}" ${d.date===today?'font-weight="700"':''}>${dd}</text>`;});
  const pts=M.days.map((d,i)=>{const l=lyOf(d);return l&&isNum(l.sales)?`${pl+i*bw+bw/2},${y(l.sales)}`:null;});
  let path='';pts.forEach(p=>{if(p)path+=(path?' L':'M')+p;});
  if(path) s+=`<path d="${path}" fill="none" stroke="var(--ly)" stroke-width="2"/>`+pts.filter(Boolean).map(p=>{const [a,b]=p.split(',');return `<circle cx="${a}" cy="${b}" r="2.4" fill="var(--ly)"/>`}).join('');
  return s+'</svg>';
}
function dailyView(){
  const M=month(S.ym); const t=todayIso();
  let h=`<section class="block"><div class="h"><h2>${ymLabel(S.ym)} · day by day</h2><span>LFL compares with the same date last year</span></div><div class="tbox"><table class="t"><thead><tr>
    <th>Date</th><th>Target</th><th>Sales</th><th>Ach %</th><th>Variance</th><th>LY sales</th><th>LFL</th><th>Footfall</th><th>Invoices</th><th>Qty</th><th>CR</th><th>ATV</th><th>ASP</th><th>UPT</th><th>Remark</th></tr></thead><tbody>`;
  const T=M.ty, R=M.r;
  h+=`<tr class="tot"><td>Month to date</td><td>${n0(M.tdTarget)}</td><td>${n0(T.sales)}</td><td>${pct(M.achTD,0)}</td><td class="${T.sales-M.tdTarget>=0?'g':'r'}">${n0(T.sales-M.tdTarget)}</td><td>${n0(M.lyM.sales)}</td><td class="${lfl(T.sales,M.lyM.sales)>=0?'g':'r'}">${sgn(lfl(T.sales,M.lyM.sales))}</td><td>${n0(T.traffic)}</td><td>${n0(T.inv)}</td><td>${n0(T.qty)}</td><td>${pct(R.cr)}</td><td>${n0(R.atv)}</td><td>${n0(R.asp)}</td><td>${n2(R.upt)}</td><td></td></tr>`;
  M.days.forEach(d=>{const e=entered(d);const r=e?ratios(tot([d])):{};const lyS=(lyOf(d)||{}).sales;const lf=e?lfl(d.sales,lyS):null;const v=e&&isNum(d.target)?d.sales-d.target:null;
    h+=`<tr class="${e?'':'future'} ${d.date===t?'today':''}"><td>${niceDate(d.date)}</td><td>${n0(d.target)}</td><td>${e?n0(d.sales):''}</td><td>${e&&d.target?pct(d.sales/d.target,0):''}</td><td class="${v==null?'':v>=0?'g':'r'}">${v==null?'':n0(v)}</td>

function staffPlan(ym){
  if(S.docs['s:'+ym]) return {staff:S.docs['s:'+ym].staff||[],own:true};
  const prev=Object.keys(S.docs).filter(k=>k.startsWith('s:')&&k.slice(2)<ym).sort().pop();
  return {staff:prev?JSON.parse(JSON.stringify(S.docs[prev].staff||[])).map(x=>({...x,leave:0})):[],own:false,from:prev&&prev.slice(2)};
}
function splitTargets(staff,monthTarget,nod){
  const w=staff.map(x=>(+x.ratio||0)*Math.max(nod-(+x.leave||0),0)/nod);const W=w.reduce((a,b)=>a+b,0);
  return w.map(v=>W?monthTarget*v/W:0);
}
function staffDay(date){return S.docs['p:'+date]||{off:[],sales:{}};}
function staffCalc(ym){
  const M=month(ym), plan=staffPlan(ym), tg=splitTargets(plan.staff,M.monthTarget,M.nod);
  const pdays=M.days.filter(d=>S.docs['p:'+d.date]);
  const lastP=pdays.length?pdays[pdays.length-1].date:null;
  const rows=plan.staff.map((x,i)=>{const t={sales:0,qty:0,inv:0};const per=M.blocks.map(()=>0);let worked=0;
    M.days.forEach(d=>{const p=S.docs['p:'+d.date];if(!p)return;const v=(p.sales||{})[x.code];if(v){for(const k in t)if(isNum(v[k]))t[k]+=v[k];if(isNum(v.sales)){worked++;const bi=d.date.slice(8)<='10'?0:d.date.slice(8)<='20'?1:2;per[bi]+=v.sales;}}});
    const r=ratios(t);
    return {...x,target:tg[i],...t,...r,worked,ach:tg[i]?t.sales/tg[i]:null,var:t.sales-tg[i],avg:worked?t.sales/worked:null,
      need:M.left?Math.max(tg[i]-t.sales,0)/M.left:null,blocks:M.blocks.map((b,bi)=>({target:M.monthTarget?tg[i]*b.target/M.monthTarget:0,sales:per[bi]}))};});
  const T=rows.reduce((a,r)=>{a.target+=r.target;a.sales+=r.sales;a.qty+=r.qty;a.inv+=r.inv;return a;},{target:0,sales:0,qty:0,inv:0});
  return {M,plan,rows,T,lastP,pdays:pdays.length};
}
function dayStaffTargets(date,staff,off){
  const d=S.docs['d:'+date]||{};const dt=isNum(d.target)?d.target:0;
  const on=staff.map(x=>off.includes(x.code)?0:(+x.ratio||0));const W=on.reduce((a,b)=>a+b,0);
  return staff.map((x,i)=>W?dt*on[i]/W:0);
}

/* ================= YTD ================= */
function ytdCalc(y){
  const rows=[];const TY={sales:0,qty:0,inv:0,traffic:0},LY={sales:0,qty:0,inv:0,traffic:0};let used=[];
  for(let m=1;m<=12;m++){const ym=`${y}-${String(m).padStart(2,'0')}`;const r=monthTotalsFor(ym);rows.push({ym,m,...r});
    if(r.ty&&r.ly&&r.ty.sales&&r.ly.sales){for(const k in TY){TY[k]+=r.ty[k]||0;LY[k]+=r.ly[k]||0;}used.push(m);}}
  return {rows,TY,LY,used};
}
function ytdStrip(){
  const y=+S.ym.slice(0,4);const Y=ytdCalc(y);if(!Y.used.length)return '';
  const a=ratios(Y.TY),b=ratios(Y.LY);const lbl=Y.used.length===1?MON[Y.used[0]-1]:MON[Y.used[0]-1]+'–'+MON[Y.used[Y.used.length-1]-1];
  return `<section class="block card"><div class="h"><h2>Year to date ${y}</h2><span>${lbl} vs same months ${y-1}</span><button class="btn right" data-tab="year">Open YTD LFL</button></div>
   <div class="daygrid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
    <div class="stat"><label>Sales</label><div class="v num">${n0(Y.TY.sales)}</div><div class="n">LY ${n0(Y.LY.sales)} ${pill(lfl(Y.TY.sales,Y.LY.sales))}</div></div>
    <div class="stat"><label>Footfall</label><div class="v num">${n0(Y.TY.traffic)}</div><div class="n">${pill(lfl(Y.TY.traffic,Y.LY.traffic))}</div></div>
    <div class="stat"><label>CR</label><div class="v num">${pct(a.cr)}</div><div class="n">LY ${pct(b.cr)} ${pill(lfl(a.cr,b.cr))}</div></div>
    <div class="stat"><label>ATV</label><div class="v num">${n0(a.atv)}</div><div class="n">LY ${n0(b.atv)} ${pill(lfl(a.atv,b.atv))}</div></div>
    <div class="stat"><label>ASP</label><div class="v num">${n0(a.asp)}</div><div class="n">LY ${n0(b.asp)} ${pill(lfl(a.asp,b.asp))}</div></div>
    <div class="stat"><label>UPT</label><div class="v num">${n2(a.upt)}</div><div class="n">LY ${n2(b.upt)} ${pill(lfl(a.upt,b.upt))}</div></div></div></section>`;
}
function ytdChart(Y,y){
  const W=760,H=230,pl=46,pr=8,pt=10,pb=26,bw=(W-pl-pr)/12;const mx=Math.max(1,...Y.rows.map(r=>Math.max(r.ty?r.ty.sales||0:0,r.ly?r.ly.sales||0:0)));
  const step=Math.pow(10,Math.floor(Math.log10(mx)));let tick=step;while(mx/tick>5)tick*=2;const top=Math.ceil(mx/tick)*tick;const yy=v=>pt+(H-pt-pb)*(1-v/top);
  let s=`<svg class="chart ytdchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly sales this year vs last year">`;
  for(let v=0;v<=top;v+=tick)s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy(v)}" y2="${yy(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${yy(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v>=1e6?(v/1e6)+'M':v>=1000?(v/1000)+'k':v}</text>`;
  Y.rows.forEach((r,i)=>{const x=pl+i*bw;const ly=r.ly&&r.ly.sales,ty=r.ty&&r.ty.sales;
    if(ly)s+=`<rect x="${x+bw*0.14}" y="${yy(ly)}" width="${bw*0.34}" height="${H-pb-yy(ly)}" rx="2" fill="var(--ly)"><title>${MONF[i]} ${y-1}: ${n0(ly)}</title></rect>`;
    if(ty)s+=`<rect x="${x+bw*0.52}" y="${yy(ty)}" width="${bw*0.34}" height="${H-pb-yy(ty)}" rx="2" fill="var(--ink)"><title>${MONF[i]} ${y}: ${n0(ty)}</title></rect>`;
    s+=`<text class="m" x="${x+bw/2}" y="${H-8}" text-anchor="middle" fill="var(--muted)" font-size="10">${MON[i]}</text>`;});
  return s+'</svg>';
}

/* ================= last year: typed in, or taken automatically from last year's saved days ================= */
function lyDate(date){return (+date.slice(0,4)-1)+date.slice(4);}
function lyOf(d){
  if(!d) return null;
  if(d.ly&&isNum(d.ly.sales)) return d.ly;
  const p=d.date?S.docs['d:'+lyDate(d.date)]:null;
  if(entered(p)) return {sales:p.sales,qty:p.qty,inv:p.inv,traffic:p.traffic,auto:true};
  return d.ly||null;
}

function applyBlock(box,r0,c0,text,transpose){
  let rows=text.replace(/\r/g,'').replace(/\n+$/,'').split('\n').map(r=>r.split('\t'));
  if(transpose){const t=[];rows.forEach((row,i)=>row.forEach((v,j)=>{(t[j]=t[j]||[])[i]=v;}));rows=t;}
  let n=0;rows.forEach((row,ri)=>row.forEach((val,ci)=>{const el=box.querySelector(`input[data-r="${r0+ri}"][data-c="${c0+ci}"]`);if(!el||el.disabled)return;el.value=(val??'').trim();el.dispatchEvent(new Event('input',{bubbles:true}));n++;}));
  return n;
}

async function bindHistory(){
  $('hiBackup').onclick=async()=>{const m=$('hiMsg');m.className='msg';m.textContent='Making a backup…';try{const n=await gas('backupNow',S.pin);m.className='msg ok';m.textContent=`Backup saved in your Google Sheet as the tab “${n}”.`;}catch(e){m.className='msg err';m.textContent='Backup failed. Try again.';}};
  let list=[];try{list=JSON.parse(await gas('getHistory',S.pin));}catch(e){$('hiList').innerHTML='<p class="msg err">Couldn’t load the history.</p>';return;}
  if(!$('hiList'))return;
  if(!list.length){$('hiList').innerHTML='<p class="note">No changes yet.</p>';return;}
  const fmtT=t=>{const d=new Date(t);return isNaN(d)?t:d.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'});};
  $('hiList').innerHTML=`<div class="tbox"><table class="t"><thead><tr><th>What changed</th><th>When</th><th>Records</th><th></th></tr></thead><tbody>`+
    list.map(b=>`<tr><td class="l">${esc(b.label)}</td><td class="l">${fmtT(b.time)}</td><td>${b.count}</td><td><button class="btn" data-undo="${esc(b.batch)}" data-label="${esc(b.label)}">Undo</button></td></tr>`).join('')+`</tbody></table></div>`;
  $('hiList').querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>confirmUndo(b.dataset.undo,b.dataset.label));
}
function confirmUndo(batch,label){
  $('sheet').innerHTML=`<h3>Undo this change?</h3><p class="note">“${esc(label)}”. The records it changed go back to how they were before. You can undo the undo afterwards if needed.</p>
    <div class="actions"><button class="btn primary" id="unGo">Undo</button><button class="btn" id="unNo">Keep it</button><span class="msg" id="unMsg"></span></div>`;
  $('scrim').hidden=false;$('unNo').onclick=()=>$('scrim').hidden=true;
  $('unGo').onclick=async()=>{$('unGo').disabled=true;try{const r=JSON.parse(await gas('undoBatch',S.pin,batch));S.rev=-1;await loadAll(true);$('scrim').hidden=true;toast('Undone: '+label,r.batch,'Undo: '+label);}
    catch(e){$('unMsg').className='msg err';$('unMsg').textContent=e.code==='pin'?'PIN not accepted. Unlock again.':'Couldn’t undo. '+(e.message||'');$('unGo').disabled=false;}};
}
let toastTimer=null;
function toast(text,batch,label){
  let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}
  t.innerHTML=`<span>${esc(text)}</span>${batch?`<button class="btn" id="toastUndo">Undo</button>`:''}`;t.hidden=false;
  if(batch)$('toastUndo').onclick=()=>{t.hidden=true;confirmUndo(batch,label);};
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true;},9000);
}

/* ================= Excel (.xlsx) writer ================= */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zip(files){const enc=new TextEncoder();const chunks=[];let off=0;const cen=[];
  const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  files.forEach(([name,str])=>{const data=enc.encode(str),nm=enc.encode(name),crc=crc32(data);
    const head=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(nm.length),...u16(0)]);
    chunks.push(head,nm,data);cen.push({nm,crc,size:data.length,off});off+=head.length+nm.length+data.length;});
  const cstart=off;cen.forEach(c=>{const h=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c.crc),...u32(c.size),...u32(c.size),...u16(c.nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(c.off)]);chunks.push(h,c.nm);off+=h.length+c.nm.length;});
  chunks.push(new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(cen.length),...u16(cen.length),...u32(off-cstart),...u32(cstart),...u16(0)]));
  const out=new Uint8Array(chunks.reduce((a,c)=>a+c.length,0));let p=0;chunks.forEach(c=>{out.set(c,p);p+=c.length;});return out;}
function xlsx(sheets){
  const x=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,'');
  const col=i=>{let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;};
  const sheetXml=sh=>{const widths=sh.head.map((h,i)=>Math.min(Math.max(String(h).length,...sh.rows.map(r=>String(r[i]??'').length))+2,48));
    let o=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>`;
    const cell=(v,r,c,st)=>{const ref=col(c)+r;if(v==null||v==='')return '';if(typeof v==='number'&&isFinite(v)){const pct=sh.fmt&&sh.fmt[c]==='%';const s=pct?(st?7:6):(st||(Number.isInteger(v)?3:2));return `<c r="${ref}" s="${s}"><v>${v}</v></c>`;}return `<c r="${ref}" t="inlineStr"${st?` s="${st}"`:''}><is><t xml:space="preserve">${x(v)}</t></is></c>`;};
    o+=`<row r="1">${sh.head.map((h,i)=>cell(h,1,i,1)).join('')}</row>`;
    sh.rows.forEach((row,ri)=>{const st=row.__total?4:0;o+=`<row r="${ri+2}">${row.map((v,ci)=>cell(v,ri+2,ci,st&&typeof v!=='number'?4:st?5:0)).join('')}</row>`;});
    return o+`</sheetData></worksheet>`;};
  const files=[['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
    ['_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ['xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${x(s.name.slice(0,31))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`],
    ['xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0.00"/></numFmts><fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF111111"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE3F1D0"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="8"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="2" fillId="3" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="164" fontId="2" fillId="3" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1"/><xf numFmtId="10" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="10" fontId="2" fillId="3" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`]];
  sheets.forEach((s,i)=>files.push([`xl/worksheets/sheet${i+1}.xml`,sheetXml(s)]));
  return zip(files);
}

/* ================= month-end Excel download ================= */
function xlMonths(scope,y){if(scope==='month')return [S.ym];const out=[];for(let m=1;m<=12;m++){const ym=`${y}-${String(m).padStart(2,'0')}`;
  const has=daysIn(ym).some(d=>S.docs['d:'+d]||S.docs['p:'+d])||S.docs['s:'+ym]||S.docs['m:'+ym];if(has)out.push(ym);}return out;}
function buildDashWorkbook(scope){
  const y=+S.ym.slice(0,4),ms=xlMonths(scope,y);
  const n=v=>isNum(v)?Math.round(v*100)/100:'';const p=v=>isNum(v)?Math.round(v*10000)/10000:'';
  const totRow=(label,vals)=>{const t=vals.slice();t[0]=label;t.__total=1;return t;};
  const sum=[],daily=[],blocks=[],staff=[],sdaily=[];
  const codes=[];const nameOf={};
  ms.forEach(ym=>{staffPlan(ym).staff.forEach(x=>{if(!codes.includes(x.code))codes.push(x.code);nameOf[x.code]=x.name;});});
  ms.forEach(ym=>{
    const M=month(ym),set=M.set,r=M.r;
    sum.push([ymLabel(ym),n(M.monthTarget),n(M.ty.sales),p(M.ach),n(M.tdTarget),p(M.achTD),M.done.length+' / '+M.nod,n(M.ty.traffic),n(M.ty.inv),n(M.ty.qty),n(r.atv),n(r.upt),n(r.asp),p(r.cr),n(M.lyM.sales),p(lfl(M.ty.sales,M.lyM.sales)),n(set.atv),n(set.upt),n(set.asp),p(set.cr)]);
    M.days.forEach(d=>{const has=entered(d)||isNum(d.target);if(!has)return;const rr=ratios(d),ly=lyOf(d)||{};
      daily.push([d.date,DOW[dObj(d.date).getDay()],n(d.target),n(d.sales),p(isNum(d.target)&&d.target&&isNum(d.sales)?d.sales/d.target:null),n(d.traffic),n(d.inv),n(d.qty),n(rr.atv),n(rr.upt),n(rr.asp),p(rr.cr),n(ly.sales),n(ly.traffic),n(ly.inv),n(ly.qty),p(lfl(d.sales,ly.sales)),d.remark||'']);});
    if(M.done.length||M.monthTarget){const t=M.ty,rr=M.r;daily.push(totRow('Total '+ymLabel(ym),['','',n(tot(M.days).target),n(t.sales),p(M.achTD),n(t.traffic),n(t.inv),n(t.qty),n(rr.atv),n(rr.upt),n(rr.asp),p(rr.cr),n(M.lyM.sales),n(M.lyM.traffic),n(M.lyM.inv),n(M.lyM.qty),p(lfl(t.sales,M.lyM.sales)),'']));}
    M.blocks.forEach(b=>blocks.push([ymLabel(ym),b.name,b.from,b.to,n(b.target),n(b.sales),p(b.target?b.sales/b.target:null),b.done+' / '+b.count]));
    const C=staffCalc(ym);
    C.rows.forEach(x=>staff.push([ymLabel(ym),x.code,x.name,x.section||'',+x.ratio||0,+x.leave||0,n(x.target),n(x.sales),p(x.ach),n(x.var),n(x.qty),n(x.inv),n(x.atv),n(x.upt),n(x.asp),x.worked,n(x.avg)]));
    if(C.rows.length)staff.push(totRow('Total '+ymLabel(ym),['','','','','','',n(C.T.target),n(C.T.sales),p(C.T.target?C.T.sales/C.T.target:null),n(C.T.sales-C.T.target),n(C.T.qty),n(C.T.inv),'','','','','']));
    M.days.forEach(d=>{const pd=S.docs['p:'+d.date];if(!pd)return;const off=(pd.off||[]).map(c=>nameOf[c]||c);
      sdaily.push([d.date,DOW[dObj(d.date).getDay()],off.join(', '),...codes.map(c=>{const v=(pd.sales||{})[c];return v&&isNum(v.sales)?n(v.sales):'';})]);});
  });
  const Y=ytdCalc(y);const ytd=Y.rows.map(r=>{const ty=r.ty||{},ly=r.ly||{};return [MONF[r.m-1]+' '+y,n(ty.sales),n(ly.sales),isNum(ty.sales)&&isNum(ly.sales)?n(ty.sales-ly.sales):'',p(lfl(ty.sales,ly.sales)),n(ty.traffic),n(ly.traffic),n(ty.inv),n(ly.inv),n(ty.qty),n(ly.qty),r.src==='daily'?'Daily entries ('+r.days+' of '+r.of+' days)':r.ty?'Month totals':''];});
  if(Y.used.length)ytd.push(totRow('Year to date ('+Y.used.length+' months)',['',n(Y.TY.sales),n(Y.LY.sales),n(Y.TY.sales-Y.LY.sales),p(lfl(Y.TY.sales,Y.LY.sales)),n(Y.TY.traffic),n(Y.LY.traffic),n(Y.TY.inv),n(Y.LY.inv),n(Y.TY.qty),n(Y.LY.qty),'']));
  const P=['','','','%','','%','','','','','','','','%','','%','','','','%'];
  return xlsx([
    {name:'Summary',head:['Month','Month target','Sales','Achievement','Target to date','Ach. to date','Days entered','Footfall','Invoices','Qty','ATV','UPT','ASP','CR','LY sales (same days)','LFL','ATV target','UPT target','ASP target','CR target'],rows:sum,fmt:P},
    {name:'Daily',head:['Date','Day','Target','Sales','Achievement','Footfall','Invoices','Qty','ATV','UPT','ASP','CR','LY sales','LY footfall','LY invoices','LY qty','LFL','Remark'],rows:daily,fmt:['','','','','%','','','','','','','%','','','','','%','']},
    {name:'10-day blocks',head:['Month','Block','From','To','Target','Sales','Achievement','Days entered'],rows:blocks,fmt:['','','','','','','%','']},
    {name:'Staff',head:['Month','Code','Name','Section','Ratio','Leave days','Target','Sales','Achievement','Variance','Qty','Invoices','ATV','UPT','ASP','Days worked','Avg per day'],rows:staff,fmt:['','','','','','','','','%']},
    {name:'Staff daily sales',head:['Date','Day','Off',...codes.map(c=>(nameOf[c]||'')+' ('+c+')')],rows:sdaily},
    {name:'YTD LFL '+y,head:['Month','This year sales','Last year sales','Growth','Growth %','TY footfall','LY footfall','TY invoices','LY invoices','TY qty','LY qty','Source'],rows:ytd,fmt:['','','','','%']}]);
}
function xlSheet(){const y=S.ym.slice(0,4);
  $('sheet').innerHTML=`<h3>Download Excel</h3><p class="note">Keep a copy of the records. Includes summary, daily figures, 10-day blocks, staff targets & sales, staff daily sales and YTD LFL.</p>
  <div class="actions" style="flex-direction:column;align-items:stretch;gap:8px"><button class="btn primary" data-xl="month">${ymLabel(S.ym)}</button><button class="btn" data-xl="year">Whole year ${y}</button><button class="btn" id="xlClose">Close</button><span class="msg" id="xlMsg"></span></div>`;
  $('scrim').hidden=false;$('xlClose').onclick=()=>$('scrim').hidden=true;
  $('sheet').querySelectorAll('[data-xl]').forEach(b=>b.onclick=()=>{try{const sc=b.dataset.xl;const bytes=buildDashWorkbook(sc);
    const store=(settings(S.ym).store||'Store').replace(/[\\/:*?"<>|]/g,'');const name=`${store} dashboard ${sc==='month'?ymLabel(S.ym):'year '+y} (${todayIso()}).xlsx`;
    const url=URL.createObjectURL(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);
    $('xlMsg').className='msg ok';$('xlMsg').textContent='Downloaded: '+name;}catch(e){$('xlMsg').className='msg err';$('xlMsg').textContent='Could not make the file: '+e.message;}});}

/* ================= events & boot ================= */
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){S.tab=t.dataset.tab;store('sc.tab',S.tab);render();window.scrollTo(0,0);return;}
  const a=e.target.closest('[data-act="wa"]');if(a)waSheet();if(e.target.closest('[data-act="xl"]'))xlSheet();});
$('scrim').addEventListener('click',e=>{if(e.target===$('scrim'))$('scrim').hidden=true;});
$('monthSel').onchange=e=>{if(S.dirty.size&&!confirmLeave())return;S.ym=e.target.value;render();};
$('prevM').onclick=()=>{const ms=allMonths();const i=ms.indexOf(S.ym);if(i>0){S.dirty.clear();S.ym=ms[i-1];render();}};
$('nextM').onclick=()=>{const ms=allMonths();const i=ms.indexOf(S.ym);if(i<ms.length-1){S.dirty.clear();S.ym=ms[i+1];render();}};
document.addEventListener('change',e=>{if(e.target.id==='yearSel'){S.year=+e.target.value;render();}if(e.target.id==='stDate'){S.staffDate=e.target.value;render();}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-sv]');if(b){S.staffView=b.dataset.sv;render();}});
function confirmLeave(){S.dirty.clear();return true;}
async function loadAll(force,cached){const raw=cached||await gas('getAll');const d=JSON.parse(raw);if(!cached)store('sc.cache',raw);S.docs=d.docs||{};S.rev=d.rev;
  if(force||(!S.busy&&!(S.tab==='entry'&&S.canWrite))) render(); else chrome();
  setStatus('Live · updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));}
async function poll(){if(document.visibilityState!=='visible'||S.busy||S.dirty.size||S.smDirty.size)return;try{const r=await gas('getRev');if(r!==S.rev)await loadAll();}catch(e){}}
(async()=>{S.tab=recall('sc.tab')||'dash';
  const pin=recall('sc.pin');if(pin){try{if(await gas('checkPin',pin)){S.pin=pin;S.canWrite=true;}else store('sc.pin');}catch(e){}}
  try{await loadAll();render();}catch(e){const c=recall('sc.cache');
    if(c){try{await loadAll(true,c);render();setStatus('Offline · showing the last saved data',true);}catch(_){}}
    else{$('app').innerHTML='<div class="card empty"><b>Couldn’t load the dashboard.</b><br>Check your internet connection and reload.</div>';setStatus('Offline',true);}
    setInterval(()=>{if(document.visibilityState==='visible')loadAll().catch(()=>{});},30000);return;}
  setInterval(poll,30000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')poll();});
})();

#instHelp{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70;display:flex;align-items:flex-end;justify-content:center}
#instHelp[hidden]{display:none}
#instHelp .box{background:#fff;color:#16202a;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));font:16px/1.5 'IBM Plex Sans',Arial,sans-serif}
@media (min-width:900px){#instHelp{align-items:center}#instHelp .box{border-radius:16px}}
#instHelp h3{margin:0 0 10px;font-size:20px}#instHelp ol{margin:0 0 14px;padding-left:22px}#instHelp li{margin:6px 0}
#instHelp button{width:100%;padding:12px;border-radius:10px;border:0;background:#16202a;color:#fff;font:600 16px inherit;cursor:pointer}
</style>
<button id="instBtn">⬇ Install app</button>
<div id="instHelp" hidden><div class="box"><h3>Install Dul-KPI Dashboard</h3><ol id="instSteps"></ol><button id="instOk">OK</button></div></div>
<script>(function(){let ev=null;const B=document.getElementById('instBtn'),H=document.getElementById('instHelp');
if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)B.hidden=true;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;});
addEventListener('appinstalled',()=>{B.hidden=true;H.hidden=true;});
B.onclick=async()=>{if(ev){ev.prompt();try{const c=await ev.userChoice;if(c&&c.outcome==='accepted')B.hidden=true;}catch(e){}ev=null;return;}
  const ua=navigator.userAgent,ios=/iPhone|iPad|iPod/.test(ua),android=/Android/.test(ua);
  document.getElementById('instSteps').innerHTML=ios?'<li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (square with an arrow ↑).</li><li>Tap <b>Add to Home Screen</b>, then <b>Add</b>.</li>'
   :android?'<li>Tap the <b>⋮</b> menu at the top right of Chrome.</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>.</li><li>Tap <b>Install</b> / <b>Add</b>. The <b>Dul KPI</b> icon appears on your home screen.</li>'
   :'<li>Click the <b>install icon</b> at the right end of Chrome’s address bar (a small screen with an arrow), <b>or</b></li><li>Click <b>⋮ → Cast, save and share → Install page as app</b>.</li><li>Click <b>Install</b>.</li>';
  H.hidden=false;};
document.getElementById('instOk').onclick=()=>{H.hidden=true;};H.onclick=e=>{if(e.target===H)H.hidden=true;};})();</script><script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
